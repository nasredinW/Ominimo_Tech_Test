version: '3.9'

services:
  fix-permissions:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    working_dir: /app
    volumes:
      - ./data:/app/data
    command: >
      bash -lc "mkdir -p /app/data/output && chown -R ${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0} /app/data/output && chmod -R g+rwX /app/data/output"
    networks:
      - airflow-network

  postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -h localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - airflow-network

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
    user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "False"
      AIRFLOW_HOME: /app/airflow
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      PYTHONPATH: /app
    volumes:
      - ./dags:/app/dags
      - ./data:/app/data
      - ./metadata:/app/metadata
      - ./src:/app/src
      - ./airflow_home:/app/airflow
      - ./airflow_variables.json:/tmp/airflow_variables.json
    ports:
      - "8080:8080"
    command: >
      bash -c "
      echo 'Waiting for postgres to be ready...' &&
      for i in {1..30}; do
        if pg_isready -h postgres -U airflow; then
          echo 'Postgres is ready!' && break;
        fi;
        echo 'Attempt '$$i': Postgres not ready, waiting...' &&
        sleep 2;
      done &&
      echo 'Running database migrations...' &&
      airflow db migrate &&
      echo 'Creating admin user...' &&
      airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com 2>/dev/null || true &&
      echo 'Seeding Airflow Variables...' &&
      python -c 'import json; from airflow.models import Variable; 
      vars_dict = json.load(open(\"/tmp/airflow_variables.json\")); 
      [Variable.set(k, v) for k, v in vars_dict.items()]; 
      print(\"✓ Variables seeded\")' &&
      echo 'Starting webserver...' &&
      airflow webserver --port 8080
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - airflow-network

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_HOME: /app/airflow
      PYTHONPATH: /app
    volumes:
      - ./dags:/app/dags
      - ./data:/app/data
      - ./metadata:/app/metadata
      - ./src:/app/src
      - ./airflow_home:/app/airflow
    command: >
      bash -c "
      echo 'Waiting for postgres to be ready...' &&
      for i in {1..30}; do
        if pg_isready -h postgres -U airflow; then
          echo 'Postgres is ready!' && break;
        fi;
        echo 'Attempt '$$i': Postgres not ready, waiting...' &&
        sleep 2;
      done &&
      echo 'Starting scheduler...' &&
      airflow scheduler
      "
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - airflow-network

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-master
    user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./metadata:/app/metadata
      - ./src:/app/src
      - spark_logs:/var/log/spark
    environment:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: /app
    command: >
      bash -c "echo 'Spark runtime container ready (Java + PySpark installed in image)'; tail -f /dev/null"
    networks:
      - airflow-network

volumes:
  postgres_data:
  spark_logs:

networks:
  airflow-network:
    driver: bridge
